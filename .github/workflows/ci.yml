name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: "1"

jobs:
  lint-and-test:
    name: Lint & test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests

      - name: Pytest
        run: python -m pytest -q

      - name: Initialize vector store
        run: auto-rag-ingest --directory data/documents

      - name: Smoke — health CLI
        run: auto-rag-health --no-llm --format json > /dev/null

      - name: Smoke — config validation CLI
        run: auto-rag-config-check --no-llm --format json > /dev/null
